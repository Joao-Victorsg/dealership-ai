# application-local.properties
# Local development overrides — activate with: -Dspring.profiles.active=local
# (or set SPRING_PROFILES_ACTIVE=local in your shell before running ./mvnw spring-boot:run)
#
# KEYCLOAK_BASE_URL: internal URL used for server-to-server calls (token exchange, JWK, userinfo).
#   When running outside Docker, point directly at localhost:8180.
# KEYCLOAK_EXTERNAL_URL: browser-facing URL embedded in the authorization redirect.
#   Must be resolvable by the user's browser — for HTTPS local dev we use auth.localhost.

KEYCLOAK_BASE_URL=http://localhost:8180
KEYCLOAK_EXTERNAL_URL=https://auth.localhost:4443

# Session cookie — with Caddy HTTPS ingress, keep Secure enabled.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
